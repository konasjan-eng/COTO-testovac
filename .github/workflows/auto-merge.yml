name: Enable auto-merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Zapnout automatické sloučení
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"

      - name: Po sloučení výslovně spustit zveřejnění
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in {1..60}; do
            MERGED_AT="$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt // ""')"
            if [ -n "$MERGED_AT" ]; then
              echo "PR je sloučen. Spouštím zveřejnění GitHub Pages."
              gh workflow run pages.yml --repo "$GH_REPO" --ref main
              exit 0
            fi
            sleep 10
          done
          echo "::error::PR se do 10 minut nesloučil, zveřejnění proto nebylo spuštěno."
          exit 1
